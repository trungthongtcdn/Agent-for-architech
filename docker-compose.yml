services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ArchRender}
    image: archrender:latest
    container_name: archrender
    restart: unless-stopped
    env_file: .env
    ports:
      # Mặc định chỉ mở cho máy chủ (127.0.0.1) để đi qua reverse proxy.
      # Đổi APP_PORT nếu cổng đã bị dự án khác dùng; APP_BIND=0.0.0.0 nếu muốn truy cập thẳng bằng IP:cổng.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3010}:3000"
    volumes:
      - archrender-data:/data

volumes:
  archrender-data:
