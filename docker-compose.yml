services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ArchRender}
    image: archrender:latest
    container_name: archrender
    restart: unless-stopped
    env_file: .env
    ports:
      # Đổi APP_PORT trong .env nếu cổng đã bị dự án khác trên VPS dùng.
      - "${APP_PORT:-3010}:3000"
    volumes:
      - archrender-data:/data

volumes:
  archrender-data:
